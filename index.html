<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f43">
<title>Ruteo Agrofield</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<style>
  /* ---------- Tipografías (alojadas con la app: funcionan sin señal) ---------- */
  @font-face { font-family: 'Public Sans'; font-weight: 100 900; font-style: normal; font-display: swap;
    src: url('fonts/public-sans.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-style: normal; font-display: swap;
    src: url('fonts/plex-mono-500.woff2') format('woff2'); }

  :root {
    --verde: #1f6f43; --verde-osc: #154f30; --verde-claro: #e5f1e9; --verde-suave: #cfe6d7; --verde-led: #9be3b4;
    --rojo: #b3261e; --rojo-borde: #e3b8b4; --rojo-claro: #f0e1df; --rojo-fondo: #fbe9e7;
    --ambar: #8a5a00; --ambar-osc: #5e3e00; --ambar-claro: #fff3d4; --ambar-punto: #d29a1e;
    --texto: #1b1f1c; --texto-2: #3c433e; --gris: #5d655f; --gris-2: #6b726c; --gris-3: #8a918b;
    --borde: #e1e4df; --borde-2: #d6dad3; --borde-3: #c9cdc6; --linea: #eef0ec;
    --fondo: #f4f5f1; --fondo-2: #e7e9e4; --blanco: #fff; --negro: #1b1f1c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font: 400 15px/1.4 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  button, input, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  .oculto { display: none !important; }

  /* ---------- Estructura ---------- */
  .pantalla { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--fondo); }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .contenido { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 14px;
    max-width: 640px; width: 100%; margin: 0 auto; }

  /* Encabezado verde */
  .header { background: var(--verde); color: #fff; padding: calc(env(safe-area-inset-top) + 16px) 18px 16px;
    display: flex; align-items: center; gap: 12px; flex: none; }
  .header .tit { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .header .tit small { font-size: 12px; opacity: .8; font-weight: 500; }
  .header .tit b { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .chip-sync { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); padding: 7px 11px;
    border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 0; color: #fff; }
  .chip-sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--verde-led); }
  .chip-sync.pend { background: var(--ambar-claro); color: var(--ambar-osc); }
  .chip-sync.pend i { background: var(--ambar-punto); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff;
    font-weight: 700; font-size: 14px; flex: none; }

  /* Barra inferior */
  .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border-top: 1px solid var(--borde);
    padding: 6px 8px calc(env(safe-area-inset-bottom) + 10px); flex: none; }
  .tab { height: 54px; border: 0; background: none; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--gris-2); }
  .tab::before { content: ''; width: 44px; height: 6px; border-radius: 3px; background: transparent; }
  .tab.sel { color: var(--verde); font-weight: 700; }
  .tab.sel::before { background: var(--verde); }

  /* Tarjetas y listas */
  .card { background: #fff; border-radius: 18px; border: 1px solid var(--borde); }
  .card.pad { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  .lista { background: #fff; border-radius: 18px; border: 1px solid var(--borde); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 64px;
    border-bottom: 1px solid var(--linea); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:active { background: var(--fondo); }
  .item .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .item .nom { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .sub { font-size: 13px; color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--borde-3); flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #fff; }
  .check.si { background: var(--verde); border-color: var(--verde); }
  .pill { font-size: 13px; font-weight: 700; color: var(--verde-osc); background: var(--verde-claro); padding: 5px 9px;
    border-radius: 99px; white-space: nowrap; }
  .pill.amb { font-size: 12px; font-weight: 600; color: var(--ambar); background: var(--ambar-claro); }
  .seccion { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 2px 0; gap: 8px; }
  .seccion b { font-size: 16px; font-weight: 700; }
  .link { font-size: 14px; font-weight: 600; color: var(--verde); text-decoration: none; background: none; border: 0; padding: 0; }
  .nota { font-size: 13px; color: var(--gris); padding: 0 2px; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .kpi b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .kpi b small { font-size: 15px; font-weight: 600; }
  .kpi span { font-size: 12px; color: var(--gris); }
  .verde { color: var(--verde); } .rojo { color: var(--rojo); }
  .estado-jornada { display: flex; align-items: center; gap: 8px; }
  .estado-jornada i { width: 9px; height: 9px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 0 4px var(--verde-claro); flex: none; }
  .estado-jornada i.off { background: var(--borde-3); box-shadow: 0 0 0 4px var(--fondo-2); }
  .estado-jornada b { font-size: 14px; font-weight: 700; }
  .estado-jornada span { margin-left: auto; font-size: 13px; color: var(--gris); }

  /* Botones */
  .btn { height: 56px; border: 0; border-radius: 14px; background: var(--verde); color: #fff; font-size: 17px; font-weight: 700;
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
  .btn:active { background: var(--verde-osc); }
  .btn.grande { height: 60px; border-radius: 16px; }
  .btn.negro { background: var(--negro); }
  .btn.borde { background: #fff; color: var(--texto); border: 1.5px solid var(--borde-2); font-size: 16px; }
  .btn.borde.verde-t { color: var(--verde); }
  .btn.peligro { height: 48px; background: #fff; color: var(--rojo); border: 1.5px solid var(--rojo-borde); border-radius: 12px; font-size: 15px; }
  .btn.chico { height: 46px; border-radius: 12px; font-size: 14px; }
  .btn[disabled] { opacity: .45; }

  /* Avisos */
  .aviso { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
  .aviso i { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 6px; }
  .aviso.amb { background: var(--ambar-claro); color: var(--ambar-osc); } .aviso.amb i { background: var(--ambar-punto); }
  .aviso.ok { background: var(--verde-claro); color: var(--verde-osc); } .aviso.ok i { background: var(--verde); }
  .aviso.err { background: var(--rojo-fondo); color: var(--rojo); } .aviso.err i { background: var(--rojo); }
  .aviso.gris { background: var(--fondo); color: var(--texto-2); } .aviso.gris i { background: var(--verde); }

  /* Formularios */
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo label { font-size: 13px; font-weight: 600; color: var(--texto-2); }
  .input { height: 52px; border: 1.5px solid var(--borde-2); border-radius: 12px; padding: 0 14px; font-size: 17px; font-weight: 600;
    background: #fff; outline: none; width: 100%; }
  .input:focus { border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde-claro); }
  .input.pin { letter-spacing: .3em; }
  .buscar { height: 50px; font-size: 16px; font-weight: 400; }
  textarea.input { height: auto; min-height: 76px; padding: 12px 14px; font-size: 15px; font-weight: 400; resize: none; }

  /* Selector segmentado */
  .segmento { display: flex; gap: 6px; background: var(--fondo-2); padding: 4px; border-radius: 12px; }
  .segmento button { flex: 1; height: 38px; border: 0; border-radius: 9px; background: transparent; font-size: 14px; font-weight: 600; color: var(--gris); }
  .segmento button.sel { background: #fff; font-weight: 700; color: var(--texto); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* Filtros del historial */
  .filtros { display: flex; gap: 6px; padding: 14px 16px 6px; flex: none; overflow-x: auto; }
  .filtros button { height: 36px; padding: 0 14px; border: 1px solid var(--borde-2); border-radius: 99px; background: #fff;
    font-size: 13px; font-weight: 600; white-space: nowrap; }
  .filtros button.sel { background: var(--negro); color: #fff; border-color: var(--negro); font-weight: 700; }

  /* Línea de tiempo */
  .dia { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 16px 8px; position: sticky; top: 0;
    background: var(--fondo); z-index: 1; gap: 8px; }
  .dia b { font-size: 15px; font-weight: 800; }
  .dia span { font-size: 12px; color: var(--gris); font-weight: 600; white-space: nowrap; }
  .tl { display: grid; grid-template-columns: 52px 22px minmax(0, 1fr); padding: 0 16px; }
  .tl .horas { display: flex; flex-direction: column; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .tl .horas b { font-size: 14px; font-weight: 700; } .tl .horas span { font-size: 12px; color: var(--gris); }
  .tl .eje { display: flex; flex-direction: column; align-items: center; }
  .tl .eje i { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--verde); }
  .tl .eje i.err { background: var(--rojo); } .tl .eje i.warn { background: var(--ambar-punto); }
  .tl .eje i.curso { background: #fff; border: 3px solid var(--verde); }
  .tl .eje s { width: 2px; flex: 1; background: var(--borde); margin-top: 4px; text-decoration: none; }
  .tl .det { display: flex; flex-direction: column; gap: 5px; padding: 0 0 18px 6px; min-width: 0; }
  .tl .det b { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .tl .det .r { font-size: 13px; color: var(--texto-2); }
  .tl .det .g { font-size: 12px; font-weight: 700; color: var(--verde-osc); }
  .tl .det .g.err { color: var(--rojo); } .tl .det .g.warn { color: var(--ambar); }
  .tl .det .obs { font-size: 13px; color: var(--gris); background: #fff; border: 1px solid var(--fondo-2); border-radius: 10px; padding: 8px 10px; line-height: 1.45; }
  .vacio { text-align: center; color: var(--gris); padding: 40px 24px; font-size: 15px; line-height: 1.5; }
  .vacio b { display: block; color: var(--texto); font-size: 17px; margin-bottom: 6px; }

  /* Hojas que suben desde abajo */
  .velo { position: fixed; inset: 0; background: rgba(15,22,17,.45); z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; }
  .velo .cerrar-area { flex: 1; }
  .hoja { background: #fff; border-radius: 28px 28px 0 0; padding: 10px 20px calc(env(safe-area-inset-bottom) + 24px);
    display: flex; flex-direction: column; gap: 16px; max-height: 88vh; overflow-y: auto; max-width: 640px; width: 100%; margin: 0 auto;
    animation: subir .22s ease-out; }
  @keyframes subir { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  .hoja .asa { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--borde-2); flex: none; }
  .hoja h2 { margin: 0; font-size: 23px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  .hoja .meta { font-size: 14px; color: var(--gris); }
  .menu-op { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 16px 4px;
    border: 0; border-bottom: 1px solid var(--linea); background: none; font-size: 16px; font-weight: 600; text-align: left; }
  .menu-op span { font-size: 13px; color: var(--gris); font-weight: 600; }
  .menu-op.rojo { color: var(--rojo); border-bottom: 0; }

  /* Pantalla GPS */
  .gps { background: #fff; align-items: center; justify-content: center; gap: 26px; padding: 40px 24px; text-align: center; z-index: 40; overflow-y: auto; }
  .radar { width: 200px; height: 200px; border-radius: 50%; background: #f1f6f2; display: flex; align-items: center; justify-content: center; flex: none; position: relative; }
  .radar .r2 { width: 136px; height: 136px; border-radius: 50%; background: #e1efe5; display: flex; align-items: center; justify-content: center; }
  .radar .r3 { width: 72px; height: 72px; border-radius: 50%; background: var(--verde); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px #fff; }
  .radar .r3 i { width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .radar.buscando::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--verde); opacity: 0;
    animation: pulso 1.6s ease-out infinite; }
  @keyframes pulso { 0% { transform: scale(.4); opacity: .7; } 100% { transform: scale(1.05); opacity: 0; } }
  .radar.amb { background: #fbf4e3; } .radar.amb .r2 { background: #f6e7c4; } .radar.amb .r3 { background: var(--ambar-punto); }
  .radar.err { background: #faeeec; } .radar.err .r2 { background: #f3d9d6; } .radar.err .r3 { background: var(--rojo); }
  .gps-txt { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 420px; }
  .gps-txt h3 { margin: 0; font-size: 22px; font-weight: 800; }
  .gps-txt p { margin: 0; font-size: 15px; color: var(--gris); line-height: 1.5; }
  .gps-datos { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
  .gps-datos div { border: 1px solid var(--borde); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .gps-datos b { font-size: 22px; font-weight: 800; }
  .gps-datos span { font-size: 12px; font-weight: 700; color: var(--verde-osc); }
  .gps-datos span.amb { color: var(--ambar); } .gps-datos span.err { color: var(--rojo); }
  .gps-acciones { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
  .gps-acciones:empty { display: none; }

  /* Visita */
  .header-visita { background: var(--verde); color: #fff; padding: calc(env(safe-area-inset-top) + 22px) 20px 20px;
    display: flex; flex-direction: column; gap: 14px; flex: none; }
  .header-visita small { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
  .header-visita b { font-size: 21px; font-weight: 800; line-height: 1.25; }
  .header-visita .reloj { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
  .estado-visita { background: #fff; border: 1px solid var(--borde); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .estado-visita .top { display: flex; align-items: center; gap: 8px; }
  .estado-visita .top .ic { width: 22px; height: 22px; border-radius: 50%; background: var(--verde); color: #fff; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; flex: none; }
  .estado-visita .top .ic.err { background: var(--rojo); } .estado-visita .top .ic.warn { background: var(--ambar-punto); }
  .estado-visita .top b { font-size: 15px; font-weight: 700; color: var(--verde-osc); }
  .estado-visita .top b.err { color: var(--rojo); } .estado-visita .top b.warn { color: var(--ambar); }
  .estado-visita .top span { margin-left: auto; font-size: 13px; color: var(--gris); white-space: nowrap; }
  .barra { position: relative; height: 10px; border-radius: 5px; background: var(--rojo-claro); }
  .barra .zona { position: absolute; left: 0; top: 0; bottom: 0; width: 66.6%; border-radius: 5px; background: var(--verde-suave); }
  .barra .punto { position: absolute; top: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--verde); border: 3px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); transform: translateX(-50%); }
  .barra .punto.err { background: var(--rojo); }
  .barra-leyenda { display: flex; justify-content: space-between; font-size: 12px; color: var(--gris); gap: 8px; }
  .resultados { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .resultados button { min-height: 58px; padding: 10px 12px; border: 1px solid var(--borde-2); background: #fff; border-radius: 12px;
    font-size: 14px; font-weight: 600; text-align: left; line-height: 1.3; }
  .resultados button.sel { border: 2px solid var(--verde); background: var(--verde-claro); color: var(--verde-osc); font-weight: 700; padding: 9px 11px; }
  .pie { padding: 12px 16px calc(env(safe-area-inset-bottom) + 16px); background: #fff; border-top: 1px solid var(--borde); flex: none; }
  .pie .btn { max-width: 608px; margin: 0 auto; }

  /* Cierre */
  .cierre { background: var(--verde-osc); color: #fff; z-index: 35; }
  .cierre .arriba { padding: calc(env(safe-area-inset-top) + 56px) 24px 30px; display: flex; flex-direction: column; gap: 10px; flex: none; }
  .cierre .arriba small { font-size: 13px; font-weight: 600; opacity: .8; }
  .cierre .arriba h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .cierre .abajo { flex: 1; background: #fbfbf9; color: var(--texto); border-radius: 28px 28px 0 0; padding: 24px 20px calc(env(safe-area-inset-bottom) + 24px);
    display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .cierre .kpi b { font-size: 30px; } .cierre .kpi span { font-size: 13px; }
  .consumo { border: 1px solid var(--borde); background: #fff; border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .consumo .kpi b { font-size: 22px; }
  .consumo p { grid-column: 1 / -1; margin: 0; font-size: 12px; color: var(--gris); line-height: 1.45; border-top: 1px solid var(--linea); padding-top: 10px; }
  .cierre .botones { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

  /* Ingreso */
  .login { background: #fff; overflow-y: auto; }
  .login .caja { flex: 1; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 64px) 24px 28px; gap: 28px;
    max-width: 460px; width: 100%; margin: 0 auto; }
  .logo { width: 76px; height: 76px; display: block; margin-left: -6px; }
  .login h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .login .sub { font-size: 15px; color: var(--gris); margin-top: 6px; }
  .login .privacidad { margin-top: auto; }

  /* Toast y carga */
  #toast { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 12px); background: var(--negro); color: #fff;
    padding: 14px 16px; border-radius: 14px; font-size: 15px; z-index: 60; opacity: 0; transform: translateY(-16px); transition: .25s;
    pointer-events: none; max-width: 560px; margin: 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  #toast.ver { opacity: 1; transform: none; }
  #cargando { position: fixed; inset: 0; background: rgba(255,255,255,.85); z-index: 70; display: flex; align-items: center;
    justify-content: center; flex-direction: column; gap: 14px; font-weight: 700; color: var(--verde-osc); }
  .spinner { width: 42px; height: 42px; border: 4px solid var(--verde-claro); border-top-color: var(--verde); border-radius: 50%; animation: g 1s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ======================= INGRESO ======================= -->
<section id="vLogin" class="pantalla login oculto">
  <div class="caja">
    <img class="logo" src="logo-ruteo.svg" alt="Agrofield · Ruteo" width="76" height="76">
    <div>
      <h1>Ruteo Agrofield</h1>
      <div class="sub">Ingresa con tu código del ERP</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="campo">
        <label for="lCodigo">Código de vendedor</label>
        <input id="lCodigo" class="input" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="Ej: 0231">
      </div>
      <div class="campo">
        <label for="lPin">PIN</label>
        <input id="lPin" class="input pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
      </div>

<script>
/* =====================================================================
   APP RUTEO AGROFIELD — lógica del celular (diseño 2a)
   ===================================================================== */
const API_URL = (window.APP_CONFIG || {}).API_URL;
const APP_VERSION = '2.1.0';   // diseño 2a
const RESULTADOS = ['Pedido tomado', 'Sin pedido – tiene stock', 'Sin pedido – no le interesa', 'Cliente cerrado', 'Solo cobranza', 'Otro'];
const PRECISION_ACEPTABLE_M = 100;
const ESTADOS_ALERTA = ['Fuera de rango', 'Sin GPS', 'Ubicación registrada', 'Sin ubicación cliente'];

/* ---------- Almacenamiento local (sobrevive a cerrar la app) ---------- */
const Local = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { alert('No se pudo guardar en el celular: ' + e.message); } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nuevoId = p => p + '-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
const hora = iso => new Date(iso).toLocaleTimeString('es-PY', { hour: '2-digit', minute: '2-digit', hour12: false });
const mismoDia = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const gs = n => 'Gs. ' + Math.round(n).toLocaleString('es-PY');
const esPriv = () => !!Local.get('sesion', {}).verViatico;   // Supervisor o Admin
const dec = (n, d) => Number(n).toLocaleString('es-PY', { minimumFractionDigits: d, maximumFractionDigits: d });
const sleep = ms => new Promise(r => setTimeout(r, ms));
function fechaLarga(iso) {
  const t = new Date(iso).toLocaleDateString('es-PY', { weekday: 'long', day: 'numeric', month: 'short' }).replace(/\./g, '').replace(',', '');
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function kmRecta(lat1, lng1, lat2, lng2) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(lat2 - lat1), dLng = r(lng2 - lng1);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const textoDist = km => km < 1 ? Math.round(km * 1000) + ' m' : dec(km, 1) + ' km';
const iniciales = n => String(n || '').trim().split(/\s+/).slice(0, 2).map(x => x[0] || '').join('').toUpperCase() || '··';

function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.add('ver');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('ver'), ms || 3500);
}
function cargando(si, txt) { $('cargandoTxt').textContent = txt || 'Cargando…'; $('cargando').classList.toggle('oculto', !si); }

/* ---------- GPS ---------- */
function leerGPS() {
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) return mal(new Error('Este celular no permite usar el GPS en el navegador.'));
    navigator.geolocation.getCurrentPosition(
      p => ok({ lat: p.coords.latitude, lng: p.coords.longitude, precision: Math.round(p.coords.accuracy) }),
      e => mal(new Error(
        e.code === 1 ? 'Permiso de ubicación denegado. Actívalo en Chrome: ⋮ > Configuración > Configuración de sitios > Ubicación.' :
        e.code === 2 ? 'No se pudo obtener la ubicación. Revisa que el GPS del celular esté encendido.' :
        'El GPS tardó demasiado. Sal a un lugar abierto e intenta de nuevo.')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
}
/** Guarda la última ubicación registrada (para "Más cerca de ti"). Nunca se envía sola al servidor. */
function guardarPos(p, origen) {
  if (p && p.lat != null) Local.set('ultimaPos', { lat: p.lat, lng: p.lng, cuando: new Date().toISOString(), origen });
}

/* ---------- Pantalla GPS ----------
   Muestra el estado del GPS y devuelve { p, estado, dist } si se continúa, o null si se cancela.
   modo: 'visita' (compara con el cliente) | 'jornada' | 'ubicar' (corrección) | 'manual' (ordenar) */
const GPS = {
  _res: null,
  pintar(clase, html, acciones) {
    $('radar').className = 'radar ' + (clase || '');
    $('gpsTxt').innerHTML = html;
    $('gpsAcciones').innerHTML = '';
    (acciones || []).forEach(a => {
      const b = document.createElement('button');
      b.className = 'btn ' + (a.clase || '');
      b.textContent = a.txt; b.onclick = a.fn;
      $('gpsAcciones').appendChild(b);
    });
  },
  async obtener(opc) {
    $('vGps').classList.remove('oculto');
    try { return await this._ciclo(opc); }
    finally { $('vGps').classList.add('oculto'); }
  },
  esperar() { return new Promise(r => this._res = r); },
  _boton(txt, val, clase) { return { txt, clase, fn: () => this._res(val) }; },
  async _ciclo(opc) {
    for (;;) {
      this.pintar('buscando', '<h3>Buscando señal GPS…</h3><p>' + esc(opc.subtitulo || 'Quédate en un lugar abierto unos segundos') + '</p>');
      let p;
      try { p = await leerGPS(); }
      catch (e) {
        this.pintar('err', '<h3>No se pudo obtener tu ubicación</h3><p>' + esc(e.message) + '</p>', [
          this._boton('Reintentar', 'reintentar'),
          ...(opc.permitirSinGps ? [this._boton('Registrar sin GPS', 'singps', 'borde')] : []),
          this._boton('Cancelar', 'cancelar', 'borde')
        ]);
        const v = await this.esperar();
        if (v === 'reintentar') continue;
        if (v === 'singps') return { p: { lat: null, lng: null, precision: null }, estado: 'Sin GPS', dist: null };
        return null;
      }
      // Precisión
      const buena = p.precision <= PRECISION_ACEPTABLE_M;
      const precTxt = '<div><b>±' + p.precision + ' m</b><span class="' + (buena ? '' : 'amb') + '">' +
        (p.precision <= 30 ? 'Precisión buena' : buena ? 'Precisión aceptable' : 'Señal débil') + '</span></div>';
      if (!buena) {
        this.pintar('amb', '<h3>Señal GPS débil</h3><p>Tu ubicación tiene un margen de ±' + p.precision + ' m. Sal a la vereda o a un lugar abierto y reintenta.</p>' +
          '<div class="gps-datos">' + precTxt + '<div><b>—</b><span class="amb">Sin confirmar</span></div></div>', [
          this._boton('Reintentar', 'reintentar'),
          ...(opc.modo === 'ubicar' ? [] : [this._boton('Usar igual', 'usar', 'borde')]),
          this._boton('Cancelar', 'cancelar', 'borde')
        ]);
        const v = await this.esperar();
        if (v === 'reintentar') continue;
        if (v === 'cancelar') return null;
      }
      // Distancia al cliente (solo en visitas)
      if (opc.modo === 'visita') {
        const c = opc.cliente, radio = (Local.get('config', {}).radio) || 200;
        if (c.lat == null) {
          const estado = buena ? 'Ubicación registrada' : 'Sin ubicación cliente';
          this.pintar(buena ? '' : 'amb', '<h3>Ubicación obtenida</h3><div class="gps-datos">' + precTxt +
            '<div><b>Nuevo</b><span class="amb">Cliente sin ubicación</span></div></div>' +
            '<p>' + (buena ? 'Se guardará tu ubicación como la del cliente (pendiente de validación).' : 'La señal es débil: el cliente seguirá sin ubicación.') + '</p><p>Abriendo visita…</p>');
          await sleep(1400);
          return { p, estado, dist: null };
        }
        const dist = Math.round(kmRecta(p.lat, p.lng, c.lat, c.lng) * 1000);
        if (dist <= radio) {
          this.pintar('', '<h3>Ubicación obtenida</h3><div class="gps-datos">' + precTxt +
            '<div><b>' + textoDist(dist / 1000) + '</b><span>Dentro del radio</span></div></div><p>Abriendo visita…</p>');
          await sleep(1200);
          return { p, estado: 'Válida', dist };
        }
        this.pintar('err', '<h3>Estás lejos del cliente</h3><div class="gps-datos">' + precTxt +
          '<div><b>' + textoDist(dist / 1000) + '</b><span class="err">Fuera del radio (' + radio + ' m)</span></div></div>' +
          '<p>Si ya estás en el local, regístrala igual: en la visita vas a poder informar la ubicación correcta.</p>', [
          this._boton('Registrar igual', 'usar'),
          this._boton('Cancelar', 'cancelar', 'borde')
        ]);
        const v = await this.esperar();
        if (v === 'cancelar') return null;
        return { p, estado: 'Fuera de rango', dist };
      }
      // Jornada / ubicar / manual
      this.pintar('', '<h3>Ubicación obtenida</h3><div class="gps-datos" style="grid-template-columns:1fr">' + precTxt + '</div>' +
        (opc.final ? '<p>' + esc(opc.final) + '</p>' : ''));
      await sleep(900);
      return { p, estado: 'OK', dist: null };
    }
  }
};

/* ---------- Comunicación con el servidor ---------- */
async function llamarAPI(accion, datos, credenciales) {
  if (!API_URL || API_URL.indexOf('http') !== 0) throw new Error('Falta configurar la URL del servidor en config.js');
  const s = credenciales || Local.get('sesion', {});
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 90000);
  try {
    // Sin encabezado Content-Type a propósito: evita el bloqueo CORS de Apps Script
    const r = await fetch(API_URL, { method: 'POST', signal: ctrl.signal,
      body: JSON.stringify({ accion, idVendedor: s.id, pin: s.pin, datos }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---------- Cola de envíos (funciona sin señal) ---------- */
const Cola = {
  get() { return Local.get('cola', []); },
  set(c) { Local.set('cola', c); App.pintarSync(); },
  agregar(accion, datos) {
    const c = this.get(); c.push({ accion, datos, creado: new Date().toISOString() }); this.set(c);
    procesarCola();
  }
};
let procesando = false;
async function procesarCola() {
  if (procesando) return;
  procesando = true;
  App.pintarSync();
  try {
    for (;;) {
      const c = Cola.get();
      if (!c.length) break;
      const item = c[0];
      let r;
      try { r = await llamarAPI(item.accion, item.datos); }
      catch (e) { break; }                        // sin conexión: se reintenta después
      if (!r.ok && r.reintentar) break;           // servidor ocupado: se reintenta después
      const c2 = Cola.get(); c2.shift(); Cola.set(c2);
      if (!r.ok) {
        const errs = Local.get('errores', []);
        errs.push({ cuando: new Date().toISOString(), accion: item.accion, error: r.error, datos: item.datos });
        Local.set('errores', errs.slice(-30));
        toast('⚠️ Un registro no se pudo guardar: ' + r.error, 6000);
      } else if (item.accion === 'finalizarJornada') {
        Local.set('ultimoResumen', Object.assign({ idJornada: item.datos.idJornada }, r.datos));
        App.resumenRecibido(item.datos.idJornada);
      } else if (item.accion === 'checkin' && r.datos && r.datos.estado === 'Ubicación registrada') {
        App.ubicLocal(item.datos.idCliente, item.datos.lat, item.datos.lng, 'Pendiente validación');
      }
    }
  } finally { procesando = false; App.pintarSync(); }
}

/* ===================================================================== */
const App = {
  tabActual: 'Hoy',
  ordenClientes: 'cerca',
  filtroHist: 'todas',
  clienteSel: null,
  timerId: null,

  init() {
    window.addEventListener('online', procesarCola);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { procesarCola(); this.refrescar(); } });
    setInterval(procesarCola, 30000);
    setInterval(() => { if (this.tabActual === 'Hoy') this.refrescar(); }, 60000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    if (Local.get('sesion', null)) {
      this.entrar();
      procesarCola();
      // Una vez por día baja la lista de clientes actualizada (ubicaciones corregidas, altas, etc.)
      if (!mismoDia(Local.get('clientesFecha', 0), new Date())) this.actualizarClientes(true);
    } else {
      this.mostrar('vLogin');
    }
  },

  mostrar(id) {
    ['vLogin', 'vMain', 'vVisita', 'vCierre'].forEach(v => $(v).classList.toggle('oculto', v !== id));
  },

  entrar() {
    const s = Local.get('sesion', {});
    $('avatar').textContent = iniciales(s.nombre);
    this.pintarSync();
    if (Local.get('visitaActual', null)) { this.mostrar('vVisita'); this.pintarVisita(); return; }
    this.mostrar('vMain');
    this.tab(this.tabActual);
  },

  refrescar() {
    if ($('vMain').classList.contains('oculto')) return;
    this.tab(this.tabActual, true);
  },

  tab(nombre, mantenerScroll) {
    this.tabActual = nombre;
    ['Hoy', 'Clientes', 'Historial'].forEach(t => $('tab' + t).classList.toggle('oculto', t !== nombre));
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('sel', b.dataset.tab === nombre));
    $('titulo').textContent = nombre === 'Clientes' ? 'Mis clientes' : nombre;
    if (nombre === 'Hoy') this.pintarHoy();
    if (nombre === 'Clientes') this.dibujarClientes();
    if (nombre === 'Historial') this.pintarHistorial();
    if (!mantenerScroll) $('scrollMain').scrollTop = 0;
  },

  /* ---------- Sesión ---------- */
  async login() {
    const id = $('lCodigo').value.trim().toUpperCase(), pin = $('lPin').value.trim();
    $('lError').classList.add('oculto');
    if (!id || !pin) return this.errLogin('Completa código y PIN.');
    cargando(true, 'Ingresando…');
    try {
      const r = await llamarAPI('login', {}, { id, pin });
      if (!r.ok) return this.errLogin(r.error);
      const d = r.datos;
      Local.set('sesion', { id: d.vendedor.id, pin, nombre: d.vendedor.nombre, rol: d.vendedor.rol, verViatico: !!d.verViatico });
      Local.set('clientes', d.clientes);
      Local.set('config', d.config);
      Local.set('clientesFecha', new Date().toISOString());
      if (d.jornadaAbierta && !Local.get('jornada', null)) Local.set('jornada', d.jornadaAbierta);
      this.tabActual = 'Hoy';
      this.entrar();
    } catch (e) {
      this.errLogin('No hay conexión con el servidor. Para el primer ingreso necesitas señal. (' + e.message + ')');
    } finally { cargando(false); }
  },
  errLogin(m) { $('lError').querySelector('span').textContent = m; $('lError').classList.remove('oculto'); },

  cerrarSesion() {
    if (Cola.get().length) return alert('Tienes ' + Cola.get().length + ' registro(s) sin enviar. Conéctate a internet y espera a que se envíen antes de cerrar sesión.');
    if (Local.get('jornada', null)) return alert('Primero finaliza tu jornada.');
    if (!confirm('¿Cerrar sesión?')) return;
    ['sesion', 'clientes', 'config', 'visitasHoy', 'ultimoResumen', 'ultimaPos', 'ultimaJornada'].forEach(k => Local.del(k));
    $('lPin').value = '';
    this.cerrarMenu();
    this.mostrar('vLogin');
  },

  async actualizarClientes(silencioso) {
    if (!silencioso) { this.cerrarMenu(); cargando(true, 'Actualizando clientes…'); }
    try {
      const r = await llamarAPI('clientes', {});
      if (!r.ok) throw new Error(r.error);
      Local.set('clientes', r.datos.clientes);
      Local.set('clientesFecha', new Date().toISOString());
      if (!silencioso) toast('✅ Lista actualizada: ' + r.datos.clientes.length + ' clientes');
      this.refrescar();
    } catch (e) { if (!silencioso) toast('No se pudo actualizar (¿sin señal?). Se usa la lista guardada.'); }
    finally { if (!silencioso) cargando(false); }
  },

  enviarPendientes() {
    const n = Cola.get().length;
    if (!n) return toast('✓ Todo está enviado');
    procesarCola(); toast('Enviando ' + n + ' pendiente(s)…');
  },

  pintarSync() {
    const n = Cola.get().length, el = $('sync');
    el.classList.toggle('pend', n > 0);
    el.querySelector('span').textContent = n ? n + ' pendiente' + (n > 1 ? 's' : '') : 'Al día';
  },

  /* ---------- Menú (al tocar las iniciales) ---------- */
  abrirMenu() {
    const s = Local.get('sesion', {}), n = Cola.get().length, e = Local.get('errores', []).length;
    $('hojaMenu').innerHTML = '<span class="asa"></span>' +
      '<div><h2>' + esc(s.nombre) + '</h2><div class="meta">Código ' + esc(s.id) + ' · ' + esc(s.rol || 'Vendedor') + '</div></div>' +
      '<div>' +
      '<button class="menu-op" onclick="App.actualizarClientes()">Actualizar lista de clientes<span>' + Local.get('clientes', []).length + ' clientes</span></button>' +
      '<button class="menu-op" onclick="App.cerrarMenu();App.enviarPendientes()">Enviar pendientes ahora<span>' + (n ? n + ' pendiente(s)' : 'Al día') + '</span></button>' +
      '<button class="menu-op" onclick="App.verErrores()">Ver errores de envío<span>' + (e || 'Ninguno') + '</span></button>' +
      '<button class="menu-op rojo" onclick="App.cerrarSesion()">Cerrar sesión</button>' +
      '</div><div class="nota" style="text-align:center">Versión ' + APP_VERSION + '</div>';
    $('vMenu').classList.remove('oculto');
  },
  cerrarMenu() { $('vMenu').classList.add('oculto'); },
  verErrores() {
    const errs = Local.get('errores', []);
    if (!errs.length) return alert('No hay errores de envío. 👍');
    alert(errs.slice(-10).map(x => new Date(x.cuando).toLocaleDateString('es-PY') + ' ' + hora(x.cuando) + ' · ' + x.accion + '\n' + x.error).join('\n\n'));
  },

  /* ---------- Datos de la jornada ---------- */
  jornada() { return Local.get('jornada', null); },
  visitas(idJornada) {
    const j = this.jornada() || Local.get('ultimaJornada', null);
    const id = idJornada || (j && j.id);
    return Local.get('visitasHoy', []).filter(v => !id || v.idJornada === id);
  },
  esValida: v => String(v.estado).indexOf('Válida') === 0,
  minutosEnClientes(vs) {
    return Math.round(vs.reduce((s, v) => s + Math.max(0, (new Date(v.salida || Date.now()) - new Date(v.llegada)) / 60000), 0));
  },

  /* ---------- Pestaña Hoy ---------- */
  pintarHoy() {
    const j = this.jornada();
    let h = '';
    if (!j) {
      h += '<div class="card pad"><div class="estado-jornada"><i class="off"></i><b>Sin jornada iniciada</b></div>' +
        '<div class="nota" style="padding:0;line-height:1.5">Iníciala cuando salgas a ruta: se registra tu punto de partida para calcular el recorrido.</div>' +
        '<button class="btn" onclick="App.iniciarJornada()">Iniciar jornada</button></div>';
    } else {
      const vs = this.visitas(j.id), vieja = !mismoDia(j.inicio, new Date());
      h += '<div class="card pad"><div class="estado-jornada"><i></i><b>Jornada en curso</b><span>desde ' + hora(j.inicio) + '</span></div>' +
        (vieja ? '<div class="aviso amb"><i></i><span>Esta jornada es del ' + esc(fechaLarga(j.inicio)) + '. Finalízala para empezar la de hoy.</span></div>' : '') +
        '<div class="kpis"><div class="kpi"><b>' + vs.length + '</b><span>Visitas</span></div>' +
        '<div class="kpi"><b class="verde">' + vs.filter(this.esValida).length + '</b><span>Válidas</span></div>' +
        '<div class="kpi"><b>' + this.minutosEnClientes(vs) + '<small> min</small></b><span>En clientes</span></div></div>' +
        '<button class="btn peligro" onclick="App.finalizarJornada()">Finalizar jornada</button></div>';
    }
    // Más cerca de ti (con la última ubicación registrada)
    const pos = Local.get('ultimaPos', null);
    h += '<div class="seccion"><b>Más cerca de ti</b><button class="link" onclick="App.tab(\'Clientes\')">Ver todos</button></div>';
    if (!pos) {
      h += '<div class="card pad" style="gap:12px"><div class="nota" style="padding:0;line-height:1.5">Todavía no hay una ubicación registrada. Toca <b>Actualizar ubicación</b> o inicia tu jornada para ver los clientes más cercanos.</div>' +
        '<button class="btn borde verde-t chico" onclick="App.actualizarPos()">Actualizar ubicación</button></div>';
    } else {
      const cerca = this.listaOrdenada('', 'cerca').filter(c => c.dist != null).slice(0, 3);
      h += cerca.length ? '<div class="lista">' + cerca.map(c => this.htmlItem(c, false)).join('') + '</div>'
                        : '<div class="card pad"><div class="nota" style="padding:0">Ninguno de tus clientes tiene ubicación cargada todavía.</div></div>';
      h += this.htmlPos(pos);
    }
    $('tabHoy').innerHTML = h;
  },
  htmlPos(pos) {
    const origen = { checkin: 'tu última visita', inicio: 'el inicio de jornada', fin: 'el fin de jornada', manual: 'tu última actualización', ubicar: 'tu última ubicación' }[pos.origen] || 'tu última ubicación';
    return '<div class="nota" style="display:flex;justify-content:space-between;gap:8px;align-items:center">' +
      '<span>Distancias según ' + origen + ' · ' + (mismoDia(pos.cuando, new Date()) ? hora(pos.cuando) : new Date(pos.cuando).toLocaleDateString('es-PY')) + '</span>' +
      '<button class="link" onclick="App.actualizarPos()">Actualizar</button></div>';
  },
  async actualizarPos() {
    const r = await GPS.obtener({ modo: 'manual', subtitulo: 'Solo para ordenar tus clientes por cercanía. No se envía al servidor.', final: 'Ordenando clientes…' });
    if (!r) return;
    guardarPos(r.p, 'manual');
    this.refrescar();
  },

  /* ---------- Pestaña Clientes ---------- */
  orden(o) { this.ordenClientes = o; this.dibujarClientes(); },
  listaOrdenada(q, orden) {
    const pos = Local.get('ultimaPos', null);
    const visitados = {};
    this.visitas().forEach(v => visitados[v.idCliente] = v);
    let lista = Local.get('clientes', []).map(c => Object.assign({}, c, {
      dist: (pos && c.lat != null) ? kmRecta(pos.lat, pos.lng, c.lat, c.lng) : null,
      visita: visitados[c.id] || null
    }));
    if (q) lista = lista.filter(c => (c.nombre + ' ' + c.id + ' ' + c.dir + ' ' + c.ciudad).toLowerCase().indexOf(q) >= 0);
    if (orden === 'cerca' && pos) lista.sort((a, b) => (a.dist == null) - (b.dist == null) || a.dist - b.dist || a.nombre.localeCompare(b.nombre));
    else lista.sort((a, b) => a.nombre.localeCompare(b.nombre));
    return lista;
  },
  htmlItem(c, conCheck) {
    return '<div class="item" data-id="' + esc(c.id) + '" onclick="App.abrirCliente(this.dataset.id)">' +
      (conCheck ? '<span class="check' + (c.visita ? ' si' : '') + '">' + (c.visita ? '✓' : '') + '</span>' : '') +
      '<div class="info"><span class="nom">' + esc(c.nombre) + '</span><span class="sub">' +
      (conCheck ? esc(c.id) + ' · ' : '') + esc(c.dir) + (c.ciudad ? ', ' + esc(c.ciudad) : '') + '</span></div>' +
      (c.lat == null ? '<span class="pill amb">Sin ubicación</span>' : (c.dist != null ? '<span class="pill">' + textoDist(c.dist) + '</span>' : '')) +
      '</div>';
  },
  dibujarClientes() {
    const pos = Local.get('ultimaPos', null);
    $('ordCerca').classList.toggle('sel', this.ordenClientes === 'cerca');
    $('ordAZ').classList.toggle('sel', this.ordenClientes === 'az');
    $('infoPos').innerHTML = this.ordenClientes === 'cerca'
      ? (pos ? this.htmlPos(pos) : '<div class="aviso amb"><i></i><span>Sin ubicación registrada todavía. <button class="link" onclick="App.actualizarPos()">Actualizar ubicación</button> para ordenar por cercanía.</span></div>')
      : '';
    const q = $('buscar').value.trim().toLowerCase();
    const lista = this.listaOrdenada(q, this.ordenClientes);
    const visitadosHoy = new Set(this.visitas().map(v => v.idCliente)).size;
    const MAX = 80;
    $('infoLista').textContent = lista.length + ' cliente' + (lista.length === 1 ? '' : 's') + ' · ' + visitadosHoy + ' visitado' + (visitadosHoy === 1 ? '' : 's') + ' hoy' +
      (lista.length > MAX ? ' · mostrando ' + MAX + ', usa el buscador' : '');
    $('listaClientes').innerHTML = lista.slice(0, MAX).map(c => this.htmlItem(c, true)).join('') ||
      '<div class="vacio"><b>Sin resultados</b>No hay clientes que coincidan con la búsqueda.</div>';
  },

  /* ---------- Hoja del cliente ---------- */
  abrirCliente(id) {
    const c = this.listaOrdenada('', 'az').find(x => x.id === id);
    if (!c) return;
    this.clienteSel = c;
    const j = this.jornada();
    const vs = this.visitas().filter(v => v.idCliente === id);
    const ult = vs[vs.length - 1];
    const mapa = c.lat != null ? 'https://www.google.com/maps/dir/?api=1&destination=' + c.lat + ',' + c.lng : null;
    $('hojaCliente').innerHTML = '<span class="asa"></span>' +
      '<div style="display:flex;flex-direction:column;gap:5px"><h2>' + esc(c.nombre) + '</h2><span class="meta">' + esc(c.id) + (c.canal ? ' · ' + esc(c.canal) : '') + '</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;font-size:15px"><span>' + esc(c.dir) + (c.ciudad ? ', ' + esc(c.ciudad) : '') + '</span>' +
      (c.marcas && c.marcas.length ? '<span class="meta">Marcas: ' + c.marcas.map(esc).join(', ') + '</span>' : '') + '</div>' +
      (ult ? '<div class="aviso ok"><i></i><span><b>Visitado hoy a las ' + hora(ult.llegada) + '</b>' + (ult.resultado ? ' · ' + esc(ult.resultado) : ' · en curso') + (vs.length > 1 ? ' (' + vs.length + ' visitas)' : '') + '</span></div>' : '') +
      (c.lat == null ? '<div class="aviso amb"><i></i><span>Sin ubicación registrada. Al llegar <b>parado en el local</b>, tu ubicación se guardará como la del cliente.</span></div>' : '') +
      (c.estUb === 'Corrección pendiente' ? '<div class="aviso amb"><i></i><span>Hay una corrección de ubicación esperando aprobación del supervisor.</span></div>' : '') +
      (mapa ? '<a class="btn borde verde-t chico" href="' + mapa + '" target="_blank" rel="noopener">Cómo llegar' + (c.dist != null ? ' · ' + textoDist(c.dist) : '') + '</a>' : '') +
      (esPriv() ? '<button class="btn borde chico" onclick="App.corregirUbicacion(false)">Fijar ubicación del cliente aquí</button>' : '') +
      (!j ? '<div class="aviso err"><i></i><span>Primero inicia tu jornada en la pestaña Hoy.</span></div>' : '') +
      '<button class="btn grande" ' + (j ? '' : 'disabled') + ' onclick="App.checkin()">Llegué — registrar visita</button>';
    $('vCliente').classList.remove('oculto');
  },
  cerrarHoja() { $('vCliente').classList.add('oculto'); },

  ubicLocal(idCliente, lat, lng, estUb) {
    const cs = Local.get('clientes', []);
    const c = cs.find(x => x.id === idCliente);
    if (!c) return;
    if (lat != null && (c.lat == null || estUb === 'Validada')) { c.lat = lat; c.lng = lng; }
    if (estUb) c.estUb = estUb;
    Local.set('clientes', cs);
  },

  /* ---------- Jornada ---------- */
  async iniciarJornada() {
    const r = await GPS.obtener({ modo: 'jornada', subtitulo: 'Registrando tu punto de partida', final: 'Iniciando jornada…', permitirSinGps: true });
    if (!r) return;
    const j = { id: nuevoId('J'), inicio: new Date().toISOString() };
    Local.set('jornada', j);
    Local.set('visitasHoy', []);
    Local.del('ultimaJornada');
    guardarPos(r.p, 'inicio');
    Cola.agregar('iniciarJornada', { id: j.id, hora: j.inicio, lat: r.p.lat, lng: r.p.lng, precision: r.p.precision });
    toast('✅ Jornada iniciada a las ' + hora(j.inicio));
    this.tab('Hoy');
  },

  async finalizarJornada() {
    const j = this.jornada();
    if (!j) return;
    if (Local.get('visitaActual', null)) return alert('Primero termina la visita en curso.');
    const vieja = !mismoDia(j.inicio, new Date());
    let p = { lat: null, lng: null };
    if (vieja) {
      // Se olvidó de finalizar: no usamos la ubicación de hoy (agregaría km falsos)
      if (!confirm('Se finalizará la jornada del ' + fechaLarga(j.inicio) + ' sin punto final (el recorrido se cuenta hasta la última visita). ¿Continuar?')) return;
    } else {
      if (!confirm('¿Finalizar la jornada? Se registrará tu ubicación actual como punto final.')) return;
      const r = await GPS.obtener({ modo: 'jornada', subtitulo: 'Registrando tu punto final', final: 'Cerrando jornada…', permitirSinGps: true });
      if (!r) return;
      p = r.p; guardarPos(p, 'fin');
    }
    const fin = vieja ? new Date(new Date(j.inicio).setHours(23, 59, 0, 0)).toISOString() : new Date().toISOString();
    Cola.agregar('finalizarJornada', { idJornada: j.id, hora: fin, lat: p.lat, lng: p.lng });
    Local.del('jornada');
    Local.set('ultimaJornada', { id: j.id, inicio: j.inicio, fin });
    Local.set('esperandoResumen', j.id);
    this.pintarCierre();
    this.mostrar('vCierre');
  },

  pintarCierre() {
    const uj = Local.get('ultimaJornada', null);
    if (!uj) return;
    const vs = this.visitas(uj.id);
    const r = Local.get('ultimoResumen', null);
    const calc = r && r.idJornada === uj.id ? r : null;
    $('cierreFecha').textContent = fechaLarga(uj.inicio) + ' · ' + hora(uj.inicio) + ' → ' + hora(uj.fin);
    $('cierreKpis').innerHTML = '<div class="kpi"><b>' + vs.length + '</b><span>Visitas</span></div>' +
      '<div class="kpi"><b class="verde">' + vs.filter(this.esValida).length + '</b><span>Válidas</span></div>' +
      '<div class="kpi"><b class="rojo">' + vs.filter(v => v.estado === 'Fuera de rango').length + '</b><span>Fuera de rango</span></div>';
    // Supervisor / Admin: km registrados y consumo estimado
    if (esPriv()) {
      const precio = (Local.get('config', {}).precioKm) || 1400;
      $('cierreConsumo').innerHTML = '<div class="consumo">' +
        '<div class="kpi"><b>' + (calc && calc.km != null ? dec(calc.km, 1) + '<small> km</small>' : '…') + '</b><span>Km registrados</span></div>' +
        '<div class="kpi"><b>' + (calc && calc.monto != null ? gs(calc.monto) : '…') + '</b><span>Consumo estimado</span></div>' +
        '<p>El consumo se calcula a ' + gs(precio) + ' por km recorrido. Los km son la distancia por calle entre el inicio, cada visita y el fin de la jornada.</p></div>';
    } else $('cierreConsumo').innerHTML = '';
    $('cierreAviso').innerHTML = calc
      ? '<div class="aviso ok"><i></i><span>Jornada registrada correctamente.</span></div>'
      : '<div class="aviso amb"><i></i><span>Enviando el cierre. Si no tienes señal, se enviará solo cuando vuelva. Abre la app con señal hasta ver "Al día".</span></div>';
  },
  resumenRecibido(idJornada) {
    if (Local.get('esperandoResumen', null) !== idJornada) return;
    Local.del('esperandoResumen');
    if (!$('vCierre').classList.contains('oculto')) this.pintarCierre();
    const r = Local.get('ultimoResumen', {});
    toast(esPriv() && r.km != null ? '✅ Jornada calculada: ' + dec(r.km, 1) + ' km · ' + gs(r.monto) : '✅ Jornada registrada', 6000);
  },
  salirCierre(tab) { this.mostrar('vMain'); this.tab(tab); },

  /* ---------- Visita ---------- */
  async checkin() {
    const c = this.clienteSel, j = this.jornada();
    if (!c || !j) return;
    if (Local.get('visitaActual', null)) return alert('Ya tienes una visita en curso.');
    this.cerrarHoja();
    const r = await GPS.obtener({ modo: 'visita', cliente: c, permitirSinGps: true });
    if (!r) return;
    const p = r.p;
    const v = { id: nuevoId('V'), idJornada: j.id, idCliente: c.id, nombre: c.nombre, checkin: new Date().toISOString(),
                estado: r.estado, dist: r.dist, precision: p.precision, resultado: null, correccion: false };
    Local.set('visitaActual', v);
    const hoy = Local.get('visitasHoy', []);
    hoy.push({ idJornada: j.id, idVisita: v.id, idCliente: c.id, nombre: c.nombre, llegada: v.checkin, salida: null,
               estado: r.estado, dist: r.dist, precision: p.precision, resultado: '', obs: '', correccion: false });
    Local.set('visitasHoy', hoy);
    guardarPos(p, 'checkin');
    Cola.agregar('checkin', { id: v.id, idJornada: j.id, idCliente: c.id, hora: v.checkin, lat: p.lat, lng: p.lng, precision: p.precision });
    if (r.estado === 'Ubicación registrada') this.ubicLocal(c.id, p.lat, p.lng, 'Pendiente validación');
    $('obs').value = '';
    this.mostrar('vVisita');
    this.pintarVisita();
  },

  pintarVisita() {
    const v = Local.get('visitaActual', null);
    if (!v) return this.entrar();
    const radio = (Local.get('config', {}).radio) || 200;
    $('visLlegada').textContent = 'Visita en curso · llegada ' + hora(v.checkin);
    $('visNombre').textContent = v.nombre;
    let cls = '', icono = '✓', titulo = 'Visita válida', cuerpo = '';
    const gpsTxt = v.precision != null ? 'GPS ±' + v.precision + ' m' : 'Sin GPS';
    if (String(v.estado).indexOf('Válida') === 0 || v.estado === 'Fuera de rango') {
      const err = v.estado === 'Fuera de rango';
      if (err) { cls = 'err'; icono = '!'; titulo = 'Fuera de rango'; }
      if (v.estado === 'Válida (ubicación corregida)') titulo = 'Válida · ubicación corregida';
      const escala = radio * 1.5, pct = Math.max(2, Math.min(98, ((v.dist || 0) / escala) * 100));
      cuerpo = '<div class="barra"><div class="zona"></div><div class="punto ' + cls + '" style="left:' + pct + '%"></div></div>' +
        '<div class="barra-leyenda"><span>A ' + textoDist((v.dist || 0) / 1000) + ' del local</span><span>Radio permitido ' + radio + ' m</span></div>';
      if (err && !v.correccion) {
        cuerpo += '<div class="nota" style="padding:0;line-height:1.5">¿Estás en el local y la ubicación guardada del cliente está mal?</div>' +
          '<button class="btn borde chico" onclick="App.corregirUbicacion(true)">' + (esPriv() ? 'Corregir ubicación del cliente' : 'Informar ubicación correcta') + '</button>';
      } else if (err && v.correccion) {
        cuerpo += '<div class="aviso amb"><i></i><span>Corrección enviada al supervisor. Si la aprueba, esta visita pasa a válida.</span></div>';
      }
    } else if (v.estado === 'Ubicación registrada') {
      cls = 'warn'; icono = '✓'; titulo = 'Ubicación del cliente registrada';
      cuerpo = '<div class="nota" style="padding:0;line-height:1.5">Era la primera visita con ubicación: se guardó la tuya como la del local, pendiente de validación del supervisor.</div>';
    } else {
      cls = 'warn'; icono = '!'; titulo = v.estado === 'Sin GPS' ? 'Visita sin GPS' : 'Cliente sin ubicación';
      cuerpo = '<div class="nota" style="padding:0;line-height:1.5">' + (v.estado === 'Sin GPS'
        ? 'No se pudo obtener tu ubicación: la visita se registra sin validar la distancia.'
        : 'La señal era débil y el cliente sigue sin ubicación. En la próxima visita se intentará de nuevo.') + '</div>';
    }
    $('visEstado').innerHTML = '<div class="estado-visita"><div class="top"><span class="ic ' + cls + '">' + icono + '</span>' +
      '<b class="' + cls + '">' + titulo + '</b><span>' + gpsTxt + '</span></div>' + cuerpo + '</div>';
    if (!$('opcionesResultado').children.length) {
      $('opcionesResultado').innerHTML = RESULTADOS.map(r =>
        '<button data-r="' + esc(r) + '" onclick="App.elegirResultado(this.dataset.r)">' + esc(r) + '</button>').join('');
    }
    this.elegirResultado(v.resultado || null, true);
    clearInterval(this.timerId);
    const tick = () => {
      const s = Math.max(0, Math.floor((Date.now() - new Date(v.checkin)) / 1000));
      const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
      $('timer').textContent = (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
    };
    tick(); this.timerId = setInterval(tick, 1000);
  },

  elegirResultado(r, soloPintar) {
    const v = Local.get('visitaActual', null);
    if (!v) return;
    if (!soloPintar) { v.resultado = r; Local.set('visitaActual', v); }
    document.querySelectorAll('#opcionesResultado button').forEach(b => b.classList.toggle('sel', b.dataset.r === r));
    $('obs').placeholder = r === 'Otro' ? 'Observación (obligatoria con "Otro")' : 'Observación (opcional)';
  },

  checkout() {
    const v = Local.get('visitaActual', null);
    if (!v) return;
    const obs = $('obs').value.trim();
    if (!v.resultado) return alert('Elige el resultado de la visita.');
    if (v.resultado === 'Otro' && !obs) return alert('Con "Otro" la observación es obligatoria.');
    const salida = new Date().toISOString();
    Cola.agregar('checkout', { idVisita: v.id, hora: salida, resultado: v.resultado, observacion: obs });
    const hoy = Local.get('visitasHoy', []);
    const e = hoy.find(x => x.idVisita === v.id);
    if (e) { e.salida = salida; e.resultado = v.resultado; e.obs = obs; e.estado = v.estado; e.dist = v.dist; e.correccion = !!v.correccion; }
    Local.set('visitasHoy', hoy);
    clearInterval(this.timerId);
    Local.del('visitaActual');
    $('obs').value = '';
    toast('✅ Visita registrada: ' + v.nombre);
    $('buscar').value = '';
    this.mostrar('vMain');
    this.tab('Hoy');
  },

  /**
   * Corrige la ubicación del cliente con el GPS actual.
   *  - Vendedor: se envía como propuesta para que el supervisor la apruebe.
   *  - Supervisor / Admin: se aplica de inmediato.
   */
  async corregirUbicacion(desdeVisita) {
    const priv = esPriv();
    const v = desdeVisita ? Local.get('visitaActual', null) : null;
    const idCliente = v ? v.idCliente : (this.clienteSel && this.clienteSel.id);
    const nombre = v ? v.nombre : (this.clienteSel && this.clienteSel.nombre);
    if (!idCliente) return;
    if (!confirm('¿Estás parado en la entrada del local de "' + nombre + '"?\n\n' +
      (priv ? 'La ubicación del cliente se reemplazará por tu ubicación actual.'
            : 'Tu ubicación actual se enviará a tu supervisor para que apruebe la corrección.'))) return;
    if (!v) this.cerrarHoja();
    const r = await GPS.obtener({ modo: 'ubicar', subtitulo: 'Parado en la entrada del local', final: priv ? 'Guardando ubicación…' : 'Enviando al supervisor…' });
    if (!r) { if (!v) this.abrirCliente(idCliente); return; }
    const p = r.p;
    Cola.agregar('proponerUbicacion', { idCliente, idVisita: v ? v.id : null, lat: p.lat, lng: p.lng, precision: p.precision, hora: new Date().toISOString() });
    guardarPos(p, 'ubicar');
    const hoy = Local.get('visitasHoy', []);
    const e = v ? hoy.find(x => x.idVisita === v.id) : null;
    if (priv) {
      this.ubicLocal(idCliente, p.lat, p.lng, 'Validada');
      if (v) {
        v.estado = 'Válida (ubicación corregida)'; v.dist = 0; v.correccion = true; Local.set('visitaActual', v);
        if (e) { e.estado = v.estado; e.dist = 0; e.correccion = true; }
      }
      toast('✅ Ubicación del cliente corregida');
    } else {
      this.ubicLocal(idCliente, null, null, 'Corrección pendiente');
      if (v) { v.correccion = true; Local.set('visitaActual', v); if (e) e.correccion = true; }
      toast('📨 Corrección enviada al supervisor para aprobación', 5000);
    }
    Local.set('visitasHoy', hoy);
    if (v) this.pintarVisita(); else this.abrirCliente(idCliente);
  },

  /* ---------- Historial (visitas de la jornada actual) ---------- */
  filtro(f) { this.filtroHist = f; this.pintarHistorial(); },
  pintarHistorial() {
    document.querySelectorAll('.filtros button').forEach(b => b.classList.toggle('sel', b.dataset.f === this.filtroHist));
    const j = this.jornada() || Local.get('ultimaJornada', null);
    const todas = j ? this.visitas(j.id) : [];
    const actual = Local.get('visitaActual', null);
    let vs = todas.slice();
    if (this.filtroHist === 'validas') vs = vs.filter(this.esValida);
    if (this.filtroHist === 'alerta') vs = vs.filter(v => ESTADOS_ALERTA.indexOf(v.estado) >= 0);
    if (!j || !todas.length) {
      $('historial').innerHTML = '<div class="vacio"><b>Todavía no hay visitas</b>Cuando registres visitas en tu jornada, van a aparecer acá con su hora, resultado y estado.</div>';
      return;
    }
    const nVal = todas.filter(this.esValida).length;
    const titulo = mismoDia(j.inicio, new Date()) ? 'Hoy, ' + fechaLarga(j.inicio).toLowerCase() : fechaLarga(j.inicio);
    let h = '<div class="dia"><b>' + esc(titulo) + '</b><span>' + todas.length + ' visita' + (todas.length === 1 ? '' : 's') + ' · ' +
      nVal + ' válida' + (nVal === 1 ? '' : 's') + '</span></div>';
    if (!vs.length) h += '<div class="vacio" style="padding-top:20px">No hay visitas con este filtro.</div>';
    h += vs.map((v, i) => {
      const enCurso = actual && actual.id === v.idVisita;
      const err = v.estado === 'Fuera de rango', ok = this.esValida(v);
      const tipo = enCurso ? 'curso' : ok ? '' : err ? 'err' : 'warn';
      const gTipo = ok ? '' : err ? 'err' : 'warn';
      const dur = v.salida ? Math.max(0, Math.round((new Date(v.salida) - new Date(v.llegada)) / 60000)) + ' min' : 'en curso';
      const gps = ok ? v.estado + (v.dist != null && v.estado === 'Válida' ? ' · ' + textoDist(v.dist / 1000) : '')
        : err ? 'Fuera de rango · ' + textoDist((v.dist || 0) / 1000) : v.estado;
      const notas = [];
      if (v.obs) notas.push(esc(v.obs));
      if (v.correccion && err) notas.push('Se informó la ubicación correcta al supervisor.');
      if (v.correccion && v.estado === 'Válida (ubicación corregida)') notas.push('Se corrigió la ubicación del cliente.');
      if (v.estado === 'Ubicación registrada') notas.push('Primera visita: se guardó la ubicación del local.');
      const ultima = i === vs.length - 1;
      return '<div class="tl"><div class="horas"><b>' + hora(v.llegada) + '</b><span>' + (v.salida ? hora(v.salida) : '··:··') + '</span></div>' +
        '<div class="eje"><i class="' + tipo + '"></i><s' + (ultima ? ' style="background:transparent"' : '') + '></s></div>' +
        '<div class="det"><b>' + esc(v.nombre) + '</b><span class="r">' + esc((enCurso ? (actual.resultado || 'Visita en curso') : v.resultado) || 'Sin resultado') + ' · ' + dur + '</span>' +
        '<span class="g ' + gTipo + '">' + esc(gps) + '</span>' +
        notas.map(n => '<span class="obs">' + n + '</span>').join('') + '</div></div>';
    }).join('');
    h += '<div class="nota" style="text-align:center;padding:8px 16px 28px;color:var(--gris-3)">Se muestran las visitas de la jornada ' +
      (this.jornada() ? 'actual' : 'del ' + esc(fechaLarga(j.inicio).toLowerCase())) + '</div>';
    $('historial').innerHTML = h;
  }
};

App.init();
</script>
</body>
</html>
